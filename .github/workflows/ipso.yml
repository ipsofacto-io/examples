name: ipso

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ipso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: ipso / plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ipsofacto-io/ipso-action@af9246eeaabc890b9dfd7d67d6995abb75ad9967 # v0.1.0
        with:
          command: plan
          args: terraform/plan.json
