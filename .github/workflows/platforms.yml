name: platforms

on:
  pull_request:
    paths:
      - platforms/**
      - atlantis/sample/**
      - .github/workflows/platforms.yml
  push:
    branches: [main]
    paths:
      - platforms/**
      - atlantis/sample/**
      - .github/workflows/platforms.yml

permissions:
  contents: read

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hooks:
    name: platforms / hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ipso and Terraform
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/bin"
          tmp="$(mktemp -d)"
          mkdir -p "$bin"
          curl -fsSL -o "${tmp}/ipso.tar.gz" https://github.com/ipsofacto-io/ipso/releases/download/v0.3.0/ipso_0.3.0_linux_amd64.tar.gz
          echo "8dbb29e0db4ed8f52bd7cd27c1015df122a854597e6aa40ed183e4850c2acdcb  ${tmp}/ipso.tar.gz" | sha256sum -c -
          tar -xzf "${tmp}/ipso.tar.gz" -C "$bin" ipso
          curl -fsSL -o "${tmp}/terraform.zip" https://releases.hashicorp.com/terraform/1.16.4/terraform_1.16.4_linux_amd64.zip
          echo "dc94af0eef1147718ad7c8daea792ed199e3e0492eec180d0adafa2a65a879df  ${tmp}/terraform.zip" | sha256sum -c -
          unzip -q "${tmp}/terraform.zip" -d "$bin"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Run each hook on real plans
        run: bash platforms/test-hooks.sh
