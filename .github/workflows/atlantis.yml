name: atlantis

on:
  pull_request:
    paths:
      - atlantis/**
      - .github/workflows/atlantis.yml
  push:
    branches: [main]
    paths:
      - atlantis/**
      - .github/workflows/atlantis.yml

permissions:
  contents: read

concurrency:
  group: atlantis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: atlantis / e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run real Atlantis on the sample
        run: bash atlantis/e2e.sh
